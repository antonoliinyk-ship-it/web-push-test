<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Customer.io Web Push Test</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 48px auto; padding: 0 16px; }
    button { font-size: 16px; padding: 10px 18px; cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .5; }
    input { font-size: 16px; padding: 8px; width: 100%; box-sizing: border-box; margin: 4px 0 12px; }
    #status { margin-top: 16px; color: #444; }
    pre { background: #f4f4f4; padding: 12px; overflow: auto; }
  </style>
</head>
<body>
  <h1>Web Push Test</h1>

  <label>User ID <input id="userId" placeholder="e.g. test-user-1"></label>
  <label>Email <input id="email" type="email" placeholder="you@example.com"></label>

  <button id="identify">1. Identify</button>
  <button id="enable" disabled>2. Enable notifications</button>
  <button id="disable" disabled>Disable</button>

  <p id="status">Loading…</p>
  <pre id="log"></pre>

  <!--
    STEP A: paste the Customer.io JavaScript source snippet here.
    App: Integrations > Customer.io API (or your JavaScript source) > Installation instructions.
    It defines the global `cioanalytics`. It must come BEFORE the plugin script below.
  -->
  <!-- PASTE JS SOURCE SNIPPET HERE -->
   <script>
  !function(){var i="cioanalytics", analytics=(window[i]=window[i]||[]);if(!analytics.initialize)if(analytics.invoked)window.console&&console.error&&console.error("Snippet included twice.");else{analytics.invoked=!0;analytics.methods=["trackSubmit","trackClick","trackLink","trackForm","pageview","identify","reset","group","track","ready","alias","debug","page","once","off","on","addSourceMiddleware","addIntegrationMiddleware","setAnonymousId","addDestinationMiddleware"];analytics.factory=function(e){return function(){var t=Array.prototype.slice.call(arguments);t.unshift(e);analytics.push(t);return analytics}};for(var e=0;e<analytics.methods.length;e++){var key=analytics.methods[e];analytics[key]=analytics.factory(key)}analytics.load=function(key,e){var t=document.createElement("script");t.type="text/javascript";t.async=!0;t.setAttribute('data-global-customerio-analytics-key', i);t.src="https://cdp.customer.io/v1/analytics-js/snippet/" + key + "/analytics.min.js";var n=document.getElementsByTagName("script")[0];n.parentNode.insertBefore(t,n);analytics._writeKey=key;analytics._loadOptions=e};analytics.SNIPPET_VERSION="4.15.3";
    analytics.load(
      "pk_us_2KuNewgEEXOt2mCkecC8gHb3jZ2Rwwi3_4UdtdY",
      // Optional: enable anonymous in-app. See https://docs.customer.io/journeys/anonymous-in-app/#enable-anonymous-in-app-messaging.
      // {
      //   "integrations": {
      //     "Customer.io In-App Plugin": {
      //       anonymousInApp: true
      //     }
      //   }
      // }
    );
    analytics.page();
  }}();
</script>


  <!-- STEP B: web push plugin. EU workspace: use https://cdp-eu.customer.io/v1/analytics-js/webPushPlugin.js -->
  <script src="https://cdp.customer.io/v1/analytics-js/webPushPlugin.js"></script>
  <script>
    // ====== CONFIG ======
    const VAPID_PUBLIC_KEY = 'BDN6IBHuNG553P_Vg8RSfNvm6kpaVE4FqDhJKbMItjyRgeVUS3BSxrXF_wvgYKHTAKl1ptDuwdtfvJARqsvpu84';            // Settings > Push > Web
    const TRACK_URL = 'https://track.customer.io';         // EU: https://track-eu.customer.io
    // GitHub Pages project sites live under /<repo-name>/, not at the domain root,
    // so the worker path must include the repo name. Change it if you rename the repo.
    // (Use '/cio-webpush-sw.js' on a custom domain or local dev server at the root.)
    const SW_URL = '/web-push-test/cio-webpush-sw.js';
    // ====================

    const $ = (id) => document.getElementById(id);
    const enable = $('enable'), disable = $('disable'), status = $('status'), logEl = $('log');
    const log = (m) => { logEl.textContent += m + '\n'; console.log(m); };

    // Feature detection (required before showing the button)
    const supported = 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;

    async function refresh() {
      const sub = await cioanalytics.webPush.subscription();
      status.textContent = sub ? 'Subscribed ✅' : 'Not subscribed (permission: ' + Notification.permission + ')';
      enable.disabled = !!sub;
      disable.disabled = !sub;
    }

    cioanalytics.ready(async () => {
      if (!supported) { status.textContent = 'This browser does not support web push.'; return; }
      if (!window.CustomerIOWebPush) { status.textContent = 'Plugin blocked or failed to load (ad blocker?).'; return; }

      await cioanalytics.register(CustomerIOWebPush.WebPushPlugin({
        vapidPublicKey: VAPID_PUBLIC_KEY,
        serviceWorkerUrl: SW_URL,
        trackUrl: TRACK_URL
      }));
      log('Plugin registered');
      await refresh();
    });

    // A device is attached only to an identified person.
    $('identify').onclick = async () => {
      const id = $('userId').value.trim();
      if (!id) return alert('Enter a user ID');
      await cioanalytics.identify(id, { email: $('email').value.trim() || undefined });
      log('Identified as ' + id);
    };

    // Safari: call subscribe() directly in the click handler, no await before it.
    enable.onclick = () => {
      enable.disabled = true;
      cioanalytics.webPush.subscribe().then(refresh).catch((error) => {
        enable.disabled = false;
        status.textContent = Notification.permission === 'denied'
          ? 'Notifications are blocked. Allow them in browser settings, then try again.'
          : error.message;
      });
    };

    disable.onclick = () => cioanalytics.webPush.unsubscribe().then(refresh);
  </script>
</body>
</html>
